
name: Telegram Auto Poster

on:
  schedule:
    - cron: "13 4 * * *"   # 09:13 Қазақстан уақыты
    - cron: "27 9 * * *"   # 14:27 Қазақстан уақыты
    - cron: "41 14 * * *"  # 19:41 Қазақстан уақыты

  workflow_dispatch:
    inputs:
      rubric:
        description: "Қай рубриканы іске қосу керек?"
        required: true
        default: "kz_news"
        type: choice
        options:
          - kz_news
          - tech_ai
          - lifehack

permissions:
  contents: read

jobs:
  publish_post:
    runs-on: ubuntu-latest

    steps:
      - name: Репозиторий кодын жүктеу
        uses: actions/checkout@v4

      - name: Python 3.11 орнату
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Кітапханаларды орнату
        run: pip install -r requirements.txt

      - name: Рубриканы анықтау және іске қосу
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.rubric }}"

          elif [ "${{ github.event.schedule }}" = "13 4 * * *" ]; then
            MODE="kz_news"

          elif [ "${{ github.event.schedule }}" = "27 9 * * *" ]; then
            MODE="tech_ai"

          elif [ "${{ github.event.schedule }}" = "41 14 * * *" ]; then
            MODE="lifehack"

          else
            echo "Белгісіз іске қосу кестесі!"
            exit 1
          fi

          echo "Іске қосылған рубрика: $MODE"

          python bot.py "$MODE"
