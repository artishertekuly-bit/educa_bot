name: Telegram Auto Poster

on:
  schedule:
    # UTC уақытымен жазылады (Қазақстан уақыты UTC+5)
    - cron: '0 4 * * *'   # 09:00 (Таңғы Қазақстан жаңалықтары)
    - cron: '0 9 * * *'   # 14:00 (Түскі ЖИ және Технология)
    - cron: '0 14 * * *'  # 19:00 (Кешкі Лайфхак пен Қызықты дерек)
  workflow_dispatch:      # Қолмен тексеріп қосу батырмасы
    inputs:
      rubric:
        description: 'Қай рубриканы тексергіңіз келеді?'
        required: true
        default: 'kz_news'
        type: choice
        options:
          - kz_news
          - tech_ai
          - lifehack

jobs:
  publish_post:
    runs-on: ubuntu-latest
    steps:
      - name: Репозиторий кодын жүктеу
        uses: actions/checkout@v4

      - name: Python 3.11 орнату
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Кітапханаларды орнату
        run: pip install -r requirements.txt

      - name: Рубриканы уақыт бойынша анықтау және іске қосу
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.rubric }}"
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            MODE="kz_news"
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            MODE="tech_ai"
          else
            MODE="lifehack"
          fi
          echo "Іске қосылған рубрика: $MODE"
          python bot.py "$MODE"
