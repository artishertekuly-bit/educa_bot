
name: Schedule Diagnostic

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check scheduler
        run: |
          echo "Workflow event: $GITHUB_EVENT_NAME"
          echo "UTC time:"
          date -u
          echo "Kazakhstan time:"
          TZ=Asia/Almaty date
          echo "GitHub scheduler is working!"
